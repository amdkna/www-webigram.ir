services:
  webigram:
    image: nginx:1.28-alpine
    pull_policy: never
    container_name: webigram-web
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public_proxy
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  public_proxy:
    external: true
  app-net:
    external: true
