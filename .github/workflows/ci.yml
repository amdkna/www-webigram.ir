name: Webigram Fast CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webigram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast checks and production build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cheap checks first
        run: bash scripts/ci/early-checks.sh

      - name: Install dependencies with registry fallback
        run: bash scripts/ci/npm-ci-fallback.sh

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Website Doctor API smoke
        shell: bash
        run: |
          set -euo pipefail
          node server/website-doctor-api.mjs >"$RUNNER_TEMP/website-doctor-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:8787/healthz >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          cat "$RUNNER_TEMP/website-doctor-api.log" || true
          exit 1

      - name: Build production site
        run: bash scripts/ci/build-site.sh

      - name: Verify production output
        run: bash scripts/ci/verify-dist.sh
