name: Inspect Webigram Self-Hosted Runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runners" \
            --jq '.runners[] | {id, name, os, status, busy, labels: [.labels[].name]}'
