name: Deploy Learn CRM menu labels via wbg-001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-learn-crm-menu.yml"
      - "recovery/learn-crm-menu-server.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-learn-crm-menu
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Learn CRM menu labels
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/opt/apps/www-learn-updateshid
          APP="$ROOT/app"
          TARGET="$APP/apps/legacy/server.mjs"
          PAYLOAD="$GITHUB_WORKSPACE/recovery/learn-crm-menu-server.mjs"

          echo "host=$(hostname)"
          test -f "$TARGET"
          test -f "$PAYLOAD"
          test -f "$ROOT/.env"

          cp "$PAYLOAD" "$TARGET"

          cd "$APP"
          docker compose --env-file "$ROOT/.env" build legacy
          docker compose --env-file "$ROOT/.env" up -d --no-deps --force-recreate legacy

          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' learn-updateshid-legacy 2>/dev/null || true)"
            echo "legacy=$status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' learn-updateshid-legacy)" = "healthy"

          docker exec learn-updateshid-legacy grep -Fq '["CRM",[' /app/server.mjs
          docker exec learn-updateshid-legacy grep -Fq '["contacts","◎","کاربران",""]' /app/server.mjs
          docker exec learn-updateshid-legacy grep -Fq '["crm-reports","↳","گزارشات",""]' /app/server.mjs

          docker rm -f learn-updateshid-gateway >/dev/null 2>&1 || true
          docker compose --env-file "$ROOT/.env" up -d --no-deps gateway

          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' learn-updateshid-gateway 2>/dev/null || true)"
            echo "gateway=$status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' learn-updateshid-gateway)" = "healthy"

          curl -kfsS --connect-timeout 3 --max-time 8 \
            --resolve learn.updateshid.ir:443:127.0.0.1 \
            https://learn.updateshid.ir/healthz | grep -q 'enrollments-live-v2'

          echo LEARN_CRM_MENU_SWAP_OK
