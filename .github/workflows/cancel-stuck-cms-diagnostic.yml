name: Release Stuck CMS Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-cms-diagnostic.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete queued CMS runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for RUN_ID in 34687909061 34687909075; do
            CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/cancel" || true)
            echo "run=${RUN_ID} cancel_http=${CODE}"
          done
