name: Release Stuck CMS Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stuck-cms-diagnostic.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsS -L -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/34687909061/cancel" \
            -o /dev/null
          echo "Cancellation requested for stuck CMS diagnostic run."
