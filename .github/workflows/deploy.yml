name: Deploy Webigram to Production Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: webigram-production
  cancel-in-progress: true

env:
  # Build on GitHub-hosted infrastructure; the production runner only pulls the finished image.
  IMAGE_NAME: ghcr.io/amdkna/www-webigram.ir

jobs:
  build-image:
    name: Build image on GitHub runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on self-hosted runner
    needs: build-image
    runs-on: [self-hosted, Linux, X64]
    environment: production
    env:
      APP_DIR: /opt/apps/www-webigram.ir
      REPO_URL: https://github.com/amdkna/www-webigram.ir.git
      COMPOSE_FILE: compose.yaml
      WEBIGRAM_IMAGE: ghcr.io/amdkna/www-webigram.ir:${{ github.sha }}

    steps:
      - name: Prepare application directory
        shell: bash
        run: |
          set -euo pipefail

          APP_PARENT="$(dirname "$APP_DIR")"
          mkdir -p "$APP_PARENT" 2>/dev/null || sudo -n mkdir -p "$APP_PARENT"

          if [ ! -w "$APP_PARENT" ]; then
            sudo -n chown "$(id -un):$(id -gn)" "$APP_PARENT"
          fi

      - name: Clone or update repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_AUTH=(-c "http.extraHeader=Authorization: Basic $AUTH")

          if [ -d "$APP_DIR/.git" ]; then
            echo "Updating existing clone in $APP_DIR"
            git -C "$APP_DIR" remote set-url origin "$REPO_URL"
            git "${GIT_AUTH[@]}" -C "$APP_DIR" fetch --prune origin main
            git -C "$APP_DIR" checkout -B main origin/main
            git -C "$APP_DIR" reset --hard origin/main
            git -C "$APP_DIR" clean -fdx
          else
            if [ -d "$APP_DIR" ] && [ -n "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              echo "$APP_DIR exists and is not an empty Git repository. Refusing to delete it."
              exit 1
            fi

            rm -rf "$APP_DIR"
            git "${GIT_AUTH[@]}" clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
          fi

          echo "Source commit: $(git -C "$APP_DIR" rev-parse --short HEAD)"

      - name: Verify Docker and Compose
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Ensure shared proxy network exists
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect public_proxy >/dev/null 2>&1 || docker network create public_proxy

      - name: Validate Compose configuration
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          WEBIGRAM_IMAGE="$WEBIGRAM_IMAGE" docker compose -f "$COMPOSE_FILE" config

      - name: Pull production image
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          docker pull "$WEBIGRAM_IMAGE"

      - name: Deploy application
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          WEBIGRAM_IMAGE="$WEBIGRAM_IMAGE" docker compose -f "$COMPOSE_FILE" up -d --remove-orphans --pull always

      - name: Verify container health
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' webigram-web 2>/dev/null || true)"
            echo "Health attempt $i/30: ${STATUS:-not-found}"

            if [ "$STATUS" = "healthy" ]; then
              docker exec webigram-web wget -q -O - http://127.0.0.1/healthz
              docker ps --filter name=webigram-web
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              docker logs --tail 200 webigram-web || true
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs --tail 200 webigram-web || true
          exit 1

      - name: Show deployed version
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Image: $WEBIGRAM_IMAGE"
          WEBIGRAM_IMAGE="$WEBIGRAM_IMAGE" docker compose -f "$COMPOSE_FILE" ps
