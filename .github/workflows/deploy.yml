name: Deploy Webigram to Production Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webigram-production
  cancel-in-progress: true

jobs:
  build-site:
    name: Build static site on GitHub runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "webigram-export:${GITHUB_SHA}" .

      - name: Extract static production files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/webigram-dist
          mkdir -p /tmp/webigram-dist

          CID="$(docker create "webigram-export:${GITHUB_SHA}")"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/usr/share/nginx/html/." /tmp/webigram-dist/
          docker rm "$CID" >/dev/null
          trap - EXIT

          test -f /tmp/webigram-dist/index.html
          du -sh /tmp/webigram-dist

      - name: Publish production-build branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd /tmp/webigram-dist
          git init -b production-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build ${GITHUB_SHA}"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraHeader=Authorization: Basic $AUTH" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:production-build

  deploy:
    name: Deploy on self-hosted runner
    needs: build-site
    runs-on: [self-hosted, Linux, X64]
    environment: production
    env:
      APP_DIR: /opt/apps/www-webigram.ir
      REPO_URL: https://github.com/amdkna/www-webigram.ir.git
      COMPOSE_FILE: compose.yaml

    # IMPORTANT: this job intentionally contains shell steps only.
    # The production server currently cannot reliably reach several
    # *.actions.githubusercontent.com endpoints used to resolve/download Actions.
    steps:
      - name: Sync repository and production build
        shell: bash
        run: |
          set -euo pipefail

          APP_PARENT="$(dirname "$APP_DIR")"
          mkdir -p "$APP_PARENT" 2>/dev/null || sudo -n mkdir -p "$APP_PARENT"
          if [ ! -w "$APP_PARENT" ]; then
            sudo -n chown "$(id -un):$(id -gn)" "$APP_PARENT"
          fi

          if [ -d "$APP_DIR/.git" ]; then
            git -C "$APP_DIR" remote set-url origin "$REPO_URL"
            git -C "$APP_DIR" fetch --prune origin main production-build
            git -C "$APP_DIR" checkout -B main origin/main
            git -C "$APP_DIR" reset --hard origin/main
            git -C "$APP_DIR" clean -fdx -e dist/ -e dist.previous/
          else
            if [ -d "$APP_DIR" ] && [ -n "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              echo "$APP_DIR exists and is not an empty Git repository. Refusing to delete it."
              exit 1
            fi
            rm -rf "$APP_DIR"
            git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
            git -C "$APP_DIR" fetch origin production-build:refs/remotes/origin/production-build
          fi

          git -C "$APP_DIR" fetch --force origin production-build:refs/remotes/origin/production-build

          NEXT_DIR="$APP_DIR/.dist-next"
          rm -rf "$NEXT_DIR"
          mkdir -p "$NEXT_DIR"
          git -C "$APP_DIR" archive origin/production-build | tar -x -C "$NEXT_DIR"
          test -f "$NEXT_DIR/index.html"

          rm -rf "$APP_DIR/dist.previous"
          if [ -d "$APP_DIR/dist" ]; then
            mv "$APP_DIR/dist" "$APP_DIR/dist.previous"
          fi
          mv "$NEXT_DIR" "$APP_DIR/dist"

          echo "Source commit: $(git -C "$APP_DIR" rev-parse --short HEAD)"
          echo "Static build commit: $(git -C "$APP_DIR" rev-parse --short origin/production-build)"
          du -sh "$APP_DIR/dist"

      - name: Verify local Docker runtime
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

          if ! docker image inspect nginx:1.28-alpine >/dev/null 2>&1; then
            echo "Required local image nginx:1.28-alpine is missing."
            echo "The image was previously used by Webigram builds and should already be cached on this server."
            exit 1
          fi

      - name: Ensure shared proxy network exists
        shell: bash
        run: |
          set -euo pipefail
          docker network inspect public_proxy >/dev/null 2>&1 || docker network create public_proxy

      - name: Validate Compose configuration
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" config

      - name: Deploy application
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans --pull never --force-recreate

      - name: Verify container health
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' webigram-web 2>/dev/null || true)"
            echo "Health attempt $i/30: ${STATUS:-not-found}"

            if [ "$STATUS" = "healthy" ]; then
              docker exec webigram-web wget -q -O - http://127.0.0.1/healthz
              docker ps --filter name=webigram-web
              rm -rf "$APP_DIR/dist.previous"
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
              docker logs --tail 200 webigram-web || true
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs --tail 200 webigram-web || true
          exit 1

      - name: Show deployed version
        shell: bash
        working-directory: /opt/apps/www-webigram.ir
        run: |
          set -euo pipefail
          echo "Source commit: $(git rev-parse --short HEAD)"
          echo "Build commit: $(git rev-parse --short origin/production-build)"
          docker compose -f "$COMPOSE_FILE" ps
