name: Recover Webigram Production via Local Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-production-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Local production recovery
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      APP_DIR: /opt/apps/www-webigram.ir
      SITE_CHANGED: 'true'
      SERVER_CHANGED: 'false'
      DIRECTUS_CHANGED: 'false'
      COMPOSE_CHANGED: 'false'
      NGINX_CHANGED: 'false'
      PUBLIC_HEALTH_URL: https://webigram.ir/healthz
      EDGE_CONTAINER: edge-nginx
    steps:
      - name: Prepare exact source revision
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/webigram-recovery-source"
          release_dir="$RUNNER_TEMP/webigram-recovery-dist"
          rm -rf "$source_dir" "$release_dir"
          mkdir -p "$source_dir" "$release_dir"

          test -d "$APP_DIR/.git"
          timeout 45s git -C "$APP_DIR" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$APP_DIR" cat-file -e "$GITHUB_SHA^{commit}"
          git -C "$APP_DIR" archive "$GITHUB_SHA" | tar -x -C "$source_dir"

          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Publish calendar tool without package installation
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DIR APP_DIR
          python3 - <<'PY'
          import os
          from pathlib import Path

          src = Path(os.environ["SOURCE_DIR"])
          app = Path(os.environ["APP_DIR"])
          dist = app / "dist"

          def render_astro(source_file, css_files):
              raw = source_file.read_text(encoding="utf-8")
              parts = raw.split("---", 2)
              if len(parts) != 3:
                  raise RuntimeError(f"Unexpected Astro frontmatter in {source_file}")
              html = parts[2].lstrip()
              html = html.replace('href={`${base}favicon.svg`}', 'href="/favicon.svg"')
              html = html.replace(
                  '<script is:inline src="/scripts/google-calendar-link.js"></script>',
                  '<script src="/scripts/google-calendar-link.js"></script>'
              )
              css = "\n".join(p.read_text(encoding="utf-8") for p in css_files)
              html = html.replace("</head>", f"<style>\n{css}\n</style>\n</head>")
              return html

          tools_html = render_astro(
              src / "src/pages/tools.astro",
              [src / "src/styles/public-tools.css"],
          )
          calendar_html = render_astro(
              src / "src/pages/tools/google-calendar-link.astro",
              [
                  src / "src/styles/public-tools.css",
                  src / "src/styles/google-calendar-link.css",
              ],
          )

          (dist / "tools").mkdir(parents=True, exist_ok=True)
          (dist / "tools/google-calendar-link").mkdir(parents=True, exist_ok=True)
          (dist / "scripts").mkdir(parents=True, exist_ok=True)

          (dist / "tools/index.html").write_text(tools_html, encoding="utf-8")
          (dist / "tools/google-calendar-link/index.html").write_text(calendar_html, encoding="utf-8")
          (dist / "scripts/google-calendar-link.js").write_text(
              (src / "public/scripts/google-calendar-link.js").read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          PY

          test -s "$APP_DIR/dist/tools/index.html"
          test -s "$APP_DIR/dist/tools/google-calendar-link/index.html"
          test -s "$APP_DIR/dist/scripts/google-calendar-link.js"
          grep -Fq 'GOOGLE CALENDAR LINK BUILDER' "$APP_DIR/dist/tools/google-calendar-link/index.html"
          grep -Fq '/tools/google-calendar-link/' "$APP_DIR/dist/tools/index.html"
          printf '%s\n' "$GITHUB_SHA" > "$APP_DIR/.last-successful-deploy"

      - name: Verify calendar tool
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --connect-timeout 3 --max-time 8               "https://webigram.ir/tools/google-calendar-link/?deploy=$GITHUB_SHA"               | grep -Fq 'GOOGLE CALENDAR LINK BUILDER'; then
              echo "Calendar tool is live."
              exit 0
            fi
            sleep 2
          done
          echo "Calendar tool did not become reachable." >&2
          exit 1

      - name: Clean temporary files
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: rm -rf "${SOURCE_DIR:-}" "${RELEASE_DIR:-}"
