name: Directus Permission Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-network-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Directus authorization internals
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Locate runtime auth modules and inspect permission storage
        working-directory: /opt/apps/www-webigram.ir
        shell: bash
        run: |
          set -euo pipefail

          echo '=== runtime module paths ==='
          docker exec webigram-directus sh -lc "find /directus -type f \( -name 'fetch-policies.js' -o -name 'fetch-raw-permissions.js' -o -name 'create-default-accountability.js' \) 2>/dev/null | head -40"

          echo '=== permission schema and public rows ==='
          docker compose exec -T directus-db sh -s <<'DB'
          set -eu
          export PGPASSWORD="$(cat /run/directus-secrets/db_password)"
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -c "
            SELECT column_name,data_type,is_nullable,column_default
            FROM information_schema.columns
            WHERE table_schema='public' AND table_name='directus_permissions'
            ORDER BY ordinal_position;
          "
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -x -c "
            SELECT id,policy,collection,action,permissions,validation,presets,fields
            FROM directus_permissions
            WHERE policy='abf8a154-5b1c-4a46-ac9c-7300570f4f17'
            ORDER BY collection,action;
          "
          DB

          echo '=== public API after fresh request ==='
          for path in '/items/services?limit=1&fields=id' '/items/portfolio?limit=1&fields=id'; do
            out=/tmp/directus-auth-diag.txt
            code=$(curl -sS -o "$out" -w '%{http_code}' --connect-timeout 3 --max-time 10 -H 'Accept: application/json' "https://cms.webigram.ir$path" || true)
            echo "--- $path HTTP $code ---"
            cat "$out" || true
            echo
          done
