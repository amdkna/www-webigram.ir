name: Directus Permission Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-network-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect live Directus API path
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Compare database, internal API and public API
        working-directory: /opt/apps/www-webigram.ir
        shell: bash
        run: |
          set -euo pipefail

          echo '=== database collection state ==='
          docker compose exec -T directus-db sh -s <<'DB'
          set -eu
          export PGPASSWORD="$(cat /run/directus-secrets/db_password)"
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -c "
            SELECT c.collection, c.hidden, c.singleton,
                   to_regclass('public.' || quote_ident(c.collection)) AS physical_table
            FROM directus_collections c
            WHERE c.collection IN ('services','services_page','portfolio','portfolio_page')
            ORDER BY c.collection;
          "
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -c "
            SELECT p.name AS policy_name, dp.policy, dp.collection, dp.action, dp.fields, dp.permissions
            FROM directus_permissions dp
            LEFT JOIN directus_policies p ON p.id = dp.policy
            WHERE dp.collection IN ('services','services_page','portfolio','portfolio_page')
            ORDER BY dp.collection, dp.action;
          "
          DB

          check() {
            local label="$1"
            local url="$2"
            local out="/tmp/webigram-diag-$(echo "$label" | tr -cd 'a-zA-Z0-9').txt"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' --connect-timeout 3 --max-time 10 -H 'Accept: application/json' "$url" || true)
            echo "--- $label HTTP $code ---"
            cat "$out" || true
            echo
          }

          echo '=== API comparison ==='
          check internal-services 'http://127.0.0.1:8055/items/services?limit=1&fields=id'
          check internal-services-page 'http://127.0.0.1:8055/items/services_page?limit=1&fields=id'
          check internal-portfolio 'http://127.0.0.1:8055/items/portfolio?limit=1&fields=id'
          check internal-portfolio-page 'http://127.0.0.1:8055/items/portfolio_page?limit=1&fields=id'

          check public-services 'https://cms.webigram.ir/items/services?limit=1&fields=id'
          check public-services-page 'https://cms.webigram.ir/items/services_page?limit=1&fields=id'
          check public-portfolio 'https://cms.webigram.ir/items/portfolio?limit=1&fields=id'
          check public-portfolio-page 'https://cms.webigram.ir/items/portfolio_page?limit=1&fields=id'

          echo '=== Directus container tail ==='
          docker logs --tail 120 webigram-directus 2>&1 || true
