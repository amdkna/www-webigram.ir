name: Directus Permission Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-network-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Directus authorization resolution
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Resolve public policies and permissions with Directus code
        working-directory: /opt/apps/www-webigram.ir
        shell: bash
        run: |
          set -euo pipefail

          docker exec webigram-directus sh -lc 'ls -ld /directus/node_modules/@directus/api || true'

          docker exec -i webigram-directus node --input-type=module - <<'NODE'
          try {
            const [{ default: getDatabase }, { getSchema }, { _fetchPolicies }, { _fetchRawPermissions }, { createDefaultAccountability }] = await Promise.all([
              import('/directus/node_modules/@directus/api/dist/database/index.js'),
              import('/directus/node_modules/@directus/api/dist/utils/get-schema.js'),
              import('/directus/node_modules/@directus/api/dist/permissions/lib/fetch-policies.js'),
              import('/directus/node_modules/@directus/api/dist/permissions/utils/fetch-raw-permissions.js'),
              import('/directus/node_modules/@directus/api/dist/permissions/utils/create-default-accountability.js'),
            ]);

            const knex = getDatabase();
            const schema = await getSchema();
            const context = { knex, schema };
            const accountability = createDefaultAccountability({ ip: '127.0.0.1' });

            const policies = await _fetchPolicies(accountability, context);
            console.log('POLICIES', JSON.stringify(policies));

            const permissions = await _fetchRawPermissions(
              { policies, accountability, collections: ['services','services_page','portfolio','portfolio_page'], action: 'read' },
              context,
            );

            console.log('PERMISSIONS', JSON.stringify(permissions.map((p) => ({
              id: p.id,
              policy: p.policy,
              collection: p.collection,
              action: p.action,
              fields: p.fields,
              permissions: p.permissions,
            }))));

            await knex.destroy();
          } catch (error) {
            console.error('DIAGNOSTIC_ERROR', error?.stack || String(error));
            process.exitCode = 1;
          }
          NODE

          echo '=== internal HTTP from Directus container ==='
          docker exec -i webigram-directus node --input-type=module - <<'NODE'
          for (const path of ['/items/services?limit=1&fields=id','/items/portfolio?limit=1&fields=id']) {
            const response = await fetch('http://127.0.0.1:8055' + path, { headers: { Accept: 'application/json' } });
            console.log(path, response.status, await response.text());
          }
          NODE
