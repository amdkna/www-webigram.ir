name: Directus Permission Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-network-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect CMS public media usage
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect public content media references
        working-directory: /opt/apps/www-webigram.ir
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T directus-db sh -s <<'DB'
          set -eu
          export PGPASSWORD="$(cat /run/directus-secrets/db_password)"
          echo '=== portfolio cover refs ==='
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -c "
            SELECT id,slug,status,cover_image FROM portfolio ORDER BY id;
          "
          echo '=== gallery refs ==='
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -c "
            SELECT g.id,g.portfolio_id,p.slug,p.status,g.directus_files_id,g.sort
            FROM portfolio_gallery g JOIN portfolio p ON p.id=g.portfolio_id
            ORDER BY g.portfolio_id,g.sort;
          "
          echo '=== blog media refs ==='
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -c "
            SELECT id,slug,status,cover_image FROM blog_posts ORDER BY id;
          "
          echo '=== directus_files public permission ==='
          psql -h 127.0.0.1 -U directus -d directus -P pager=off -x -c "
            SELECT id,policy,collection,action,permissions,fields
            FROM directus_permissions
            WHERE policy='abf8a154-5b1c-4a46-ac9c-7300570f4f17'
              AND collection='directus_files';
          "
          DB
