name: Coursino host repair

on:
  push:
    branches:
      - diagnostics/coursino-host-repair
    paths:
      - '.github/workflows/coursino-host-repair.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Diagnose and repair Coursino RTMP state
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PATH=/opt/apps/live.webigram.ir
          echo "hostname=$(hostname)"
          test -d "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          echo '=== COURSINO CONTAINERS ==='
          docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E 'coursino-live($|-)' || true

          echo '=== PERSISTED EGRESS STATE BEFORE ==='
          for file in data/aparat-egress.json data/arvan-egress.json; do
            echo "-- $file"
            if [ -f "$file" ]; then
              python3 - "$file" <<'PY'
          import json, sys
          p=sys.argv[1]
          try:
              d=json.load(open(p, encoding='utf-8'))
              rooms=d.get('rooms') or {}
              print('entries=',len(rooms))
              for room,v in rooms.items():
                  print('room=',room,'egress_id=',v.get('egressId','missing'),'verified_at=',v.get('verifiedAt','missing'))
          except Exception as e:
              print('read_error=',type(e).__name__)
          PY
            else
              echo 'missing=true'
            fi
          done

          echo '=== DESTINATION SHAPE / TCP ==='
          SETTINGS_FILE="$DEPLOY_PATH/data/settings.json"
          if [ -f "$SETTINGS_FILE" ]; then
            python3 - "$SETTINGS_FILE" <<'PY' > /tmp/coursino_destinations
          import json,sys
          from urllib.parse import urlparse
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          for prefix in ('aparat','arvan'):
              raw=str(d.get(prefix+'StreamUrl') or '').strip()
              key=str(d.get(prefix+'StreamKey') or '').strip()
              p=urlparse(raw)
              host=p.hostname or ''
              port=p.port or (443 if p.scheme=='rtmps' else 1935)
              print(prefix,p.scheme or 'missing',host or 'missing',port,len(key),bool(d.get(prefix+'Enabled')))
          PY
            while read -r name scheme host port keylen enabled; do
              echo "$name scheme=$scheme host=$host port=$port key_length=$keylen enabled=$enabled"
              if [ "$host" != missing ]; then
                getent ahosts "$host" | head -n 4 || true
                if timeout 6 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
                  echo "${name}_tcp_reachable=true"
                else
                  echo "${name}_tcp_reachable=false"
                fi
              fi
            done < /tmp/coursino_destinations
          else
            echo 'settings_file_missing=true'
          fi

          echo '=== RECENT EGRESS LOGS (REDACTED) ==='
          docker logs --since 45m coursino-live-egress 2>&1 \
            | sed -E 's#rtmps?://[^[:space:]"\\]+#rtmp://[REDACTED]#g; s#(api[_ -]?(key|secret)|stream[_ -]?key)[=: ]+[^, }]+#\1=[REDACTED]#Ig' \
            | grep -Ei 'error|fail|capacity|resource|egress|rtmp|stream|retry|pipeline|gstreamer|update' \
            | tail -n 300 || true

          echo '=== RECENT APP LOGS (REDACTED) ==='
          docker logs --since 45m coursino-live 2>&1 \
            | sed -E 's#rtmps?://[^[:space:]"\\]+#rtmp://[REDACTED]#g; s#(api[_ -]?(key|secret)|stream[_ -]?key)[=: ]+[^, }]+#\1=[REDACTED]#Ig' \
            | grep -Ei 'arvan|aparat|egress|rtmp|update' \
            | tail -n 300 || true

          echo '=== CLEAR STALE APP STATE ==='
          rm -f data/aparat-egress.json data/arvan-egress.json
          test ! -e data/aparat-egress.json
          test ! -e data/arvan-egress.json
          echo 'stale_state_cleared=true'

          echo '=== COURSINO ACTIONS RUNNER SERVICES ==='
          systemctl list-unit-files --type=service 2>/dev/null | grep -Ei 'actions\.runner.*coursino|coursino.*runner' || true
          RUNNER_UNIT="$(systemctl list-unit-files --type=service 2>/dev/null | awk '/actions\.runner/ && /coursino/ {print $1; exit}')"
          if [ -n "$RUNNER_UNIT" ]; then
            echo "coursino_runner_unit=$RUNNER_UNIT"
            if sudo -n true 2>/dev/null; then
              sudo -n systemctl restart "$RUNNER_UNIT"
              sleep 3
              sudo -n systemctl is-active "$RUNNER_UNIT"
              echo 'coursino_runner_restarted=true'
            else
              echo 'coursino_runner_restart_skipped=no_passwordless_sudo'
            fi
          else
            echo 'coursino_runner_unit_not_found=true'
          fi
