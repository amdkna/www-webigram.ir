name: Emergency Deploy Coursino Chat Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unstick-production-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Patch and deploy live.webigram.ir
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_HOST: webigram.ir
      SSH_PORT: '34822'
      SSH_USER: arna
    steps:
      - name: Configure production SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEBIGRAM_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/webigram_deploy"
          chmod 600 "$HOME/.ssh/webigram_deploy"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          [webigram.ir]:34822 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHwe+Xzw7jZbNHs5vNgh0vKz7WSbVnBZ9eIlgjByfpg
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Patch and rebuild Coursino Live
        run: |
          set -euo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/webigram_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=8 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR=/opt/apps/live.webigram.ir
          TARGET_SHA=1b6c443600ff54b84abbb3a5666b1e77de5fe0fd
          cd "$APP_DIR"

          echo "before_deployed_commit=$(cat data/deployed-commit 2>/dev/null || echo unknown)"
          command -v patch >/dev/null

          if [ -f lib/client-room-access.ts ] \
             && grep -q 'fetchWithRoomAccess' components/persistent-chat-panel.tsx \
             && grep -q 'messageLink' components/persistent-chat-panel.module.css; then
            echo 'Coursino chat patch is already present in source tree.'
          else
            BACKUP="/tmp/coursino-chat-fix-backup-$(date +%s)"
            mkdir -p "$BACKUP/components" "$BACKUP/lib"
            cp components/chat-with-engagement.tsx "$BACKUP/components/"
            cp components/persistent-chat-panel.module.css "$BACKUP/components/"
            cp components/persistent-chat-panel.tsx "$BACKUP/components/"
            cp components/room-engagement-panel.tsx "$BACKUP/components/"
            cp components/room-entry.tsx "$BACKUP/components/"
            [ ! -f lib/client-room-access.ts ] || cp lib/client-room-access.ts "$BACKUP/lib/"
            echo "backup=$BACKUP"

            cat > /tmp/coursino-chat-fix.patch <<'PATCH'
          diff --git a/components/chat-with-engagement.tsx b/components/chat-with-engagement.tsx
