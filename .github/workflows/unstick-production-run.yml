name: Unstick Webigram Production Runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unstick-production-run.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stuck-run:
    name: Cancel stuck production run
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      STUCK_RUN_ID: "34739302768"
    steps:
      - name: Cancel stuck production deployment
        run: |
          set -euo pipefail
          echo "Cancelling workflow run ${STUCK_RUN_ID}."

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}/cancel" || true

          for i in $(seq 1 5); do
            STATUS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}" --jq '.status')
            CONCLUSION=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}" --jq '.conclusion // ""')
            echo "normal_cancel_attempt=$i status=$STATUS conclusion=$CONCLUSION"
            [ "$STATUS" = "completed" ] && exit 0
            sleep 2
          done

          echo "Normal cancellation was not acknowledged; force-cancelling run ${STUCK_RUN_ID}."
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}/force-cancel" || true

          for i in $(seq 1 30); do
            STATUS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}" --jq '.status')
            CONCLUSION=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STUCK_RUN_ID}" --jq '.conclusion // ""')
            echo "force_cancel_attempt=$i status=$STATUS conclusion=$CONCLUSION"
            [ "$STATUS" = "completed" ] && exit 0
            sleep 2
          done

          echo "ERROR: Workflow run ${STUCK_RUN_ID} remained active after force-cancel." >&2
          exit 1
