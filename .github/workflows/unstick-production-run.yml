name: Verify Coursino Chat Deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unstick-production-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify live.webigram.ir
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SSH_HOST: webigram.ir
      SSH_PORT: '34822'
      SSH_USER: arna
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEBIGRAM_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/webigram_deploy"
          chmod 600 "$HOME/.ssh/webigram_deploy"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          [webigram.ir]:34822 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHwe+Xzw7jZbNHs5vNgh0vKz7WSbVnBZ9eIlgjByfpg
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify deployed source and container
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/webigram_deploy" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/apps/live.webigram.ir
          EXPECTED=1b6c443600ff54b84abbb3a5666b1e77de5fe0fd
          cd "$APP_DIR"

          ACTUAL="$(cat data/deployed-commit)"
          echo "deployed_commit=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          grep -q 'fetchWithRoomAccess' components/persistent-chat-panel.tsx
          grep -q 'renderMessageText' components/persistent-chat-panel.tsx
          grep -q 'target="_blank"' components/persistent-chat-panel.tsx
          grep -q 'grid-template-rows: auto auto' components/persistent-chat-panel.module.css
          grep -q 'max-height: min(300px, 35vh)' components/persistent-chat-panel.module.css
          grep -q 'fetchWithRoomAccess' components/room-engagement-panel.tsx
          echo 'source_markers=ok'

          HEALTH="$(curl -fsS http://127.0.0.1:18080/healthz)"
          echo "internal_health=$HEALTH"
          test "$HEALTH" = 'ok'

          PUBLIC_HEALTH="$(curl -fsS https://live.webigram.ir/healthz)"
          echo "public_health=$PUBLIC_HEALTH"
          test "$PUBLIC_HEALTH" = 'ok'

          docker inspect -f 'container_started={{.State.StartedAt}} image={{.Image}}' coursino-live

          RUNNER_SERVICE='actions.runner.amdkna-www-coursino-live.www-coursino-live-wbg-001.service'
          if systemctl is-active --quiet "$RUNNER_SERVICE"; then
            echo "runner_service=$RUNNER_SERVICE active"
            if sudo -n systemctl restart "$RUNNER_SERVICE" 2>/dev/null; then
              echo 'runner_restart=success'
            else
              echo 'runner_restart=not_permitted'
            fi
          else
            echo 'runner_service=not_active'
          fi
          REMOTE

      - name: Cleanup
        if: ${{ always() }}
        run: rm -rf "$HOME/.ssh/webigram_deploy" "$HOME/.ssh/known_hosts"
