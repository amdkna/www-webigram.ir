          +'use client';
          +
          +import type { AppRole } from '@/lib/access';
          +import type { Gender } from '@/lib/profile';
          +
          +type RoomAccessContext = {
          +  room: string;
          +  name: string;
          +  role: AppRole;
          +  gender: Gender;
          +};
          +
          +const recoveries = new Map<string, Promise<boolean>>();
          +
          +function recoveryKey(context: RoomAccessContext) {
          +  return `${context.room}:${context.role}:${context.name}`;
          +}
          +
          +export function recoverRoomAccess(context: RoomAccessContext) {
          +  const key = recoveryKey(context);
          +  const active = recoveries.get(key);
          +  if (active) return active;
          +
          +  const recovery = fetch('/api/token', {
          +    method: 'POST',
          +    headers: { 'content-type': 'application/json' },
          +    body: JSON.stringify(context),
          +    cache: 'no-store',
          +  })
          +    .then((response) => response.ok)
          +    .catch(() => false)
          +    .finally(() => {
          +      if (recoveries.get(key) === recovery) recoveries.delete(key);
          +    });
          +
          +  recoveries.set(key, recovery);
          +  return recovery;
          +}
          +
          +export async function fetchWithRoomAccess(
          +  input: RequestInfo | URL,
          +  init: RequestInit | undefined,
          +  context: RoomAccessContext,
          +) {
          +  let response = await fetch(input, init);
          +  if (response.status !== 401) return response;
          +
          +  const recovered = await recoverRoomAccess(context);
          +  if (!recovered) return response;
          +
          +  response = await fetch(input, init);
          +  return response;
          +}
          PATCH

            # Remove YAML indentation from the embedded diff before applying it.
            sed -i 's/^          //' /tmp/coursino-chat-fix.patch
            patch -p1 --forward --batch < /tmp/coursino-chat-fix.patch
          fi

          test -f lib/client-room-access.ts
          grep -q 'fetchWithRoomAccess' components/persistent-chat-panel.tsx
          grep -q 'messageLink' components/persistent-chat-panel.module.css

          timeout 600s docker compose build coursino-live
          timeout 120s docker compose up -d --no-deps coursino-live

          for attempt in $(seq 1 40); do
            if timeout 5s curl --fail --silent --show-error http://127.0.0.1:18080/healthz | grep -qx 'ok'; then
              echo 'Coursino Live application health check passed.'
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo 'ERROR: application health check failed after emergency deploy.'
              timeout 10s docker logs --tail=160 coursino-live 2>&1 || true
              exit 1
            fi
            sleep 2
          done

          printf '%s\n' "$TARGET_SHA" > data/deployed-commit
          echo "after_deployed_commit=$(cat data/deployed-commit)"

          echo 'Runner services containing coursino (best effort):'
          systemctl list-units --type=service --all 2>/dev/null | grep -i 'actions.runner.*coursino' || true
          SERVICE=$(systemctl list-unit-files --type=service 2>/dev/null | awk '/actions\.runner.*coursino/ {print $1; exit}')
          if [ -n "${SERVICE:-}" ]; then
            if sudo -n systemctl restart "$SERVICE"; then
              echo "restarted_runner_service=$SERVICE"
            else
              echo "warning: could not restart $SERVICE without interactive sudo"
            fi
          fi
          REMOTE

      - name: Remove temporary SSH material
        if: ${{ always() }}
        run: rm -rf "$HOME/.ssh/webigram_deploy" "$HOME/.ssh/known_hosts"
