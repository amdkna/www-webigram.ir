name: Deploy Webigram to Production Server

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/deploy-fast.yml'
      - '.github/workflows/unstick-production-run.yml'
      - '.github/workflows/release-stale-deploy-lock.yml'
      - '.github/workflows/recover-stale-deploy.yml'
      - 'scripts/deploy/remote-deploy.sh'
      - 'scripts/deploy/sync-release.sh'

permissions:
  contents: read

jobs:
  prepare:
    name: Classify, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: webigram-build-main
      cancel-in-progress: true
    outputs:
      site_changed: ${{ steps.changes.outputs.site_changed }}
      server_changed: ${{ steps.changes.outputs.server_changed }}
      directus_changed: ${{ steps.changes.outputs.directus_changed }}
      compose_changed: ${{ steps.changes.outputs.compose_changed }}
      nginx_changed: ${{ steps.changes.outputs.nginx_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/deploy/classify-changes.sh "$BEFORE_SHA" "$GITHUB_SHA" "${{ github.event_name }}" "$GITHUB_OUTPUT"

      - name: Cheap checks first
        run: bash scripts/ci/early-checks.sh

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.site_changed == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with registry fallback
        if: steps.changes.outputs.site_changed == 'true'
        run: bash scripts/ci/npm-ci-fallback.sh

      - name: Astro and TypeScript checks
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run check

      - name: Build production site
        if: steps.changes.outputs.site_changed == 'true'
        run: bash scripts/ci/build-site.sh

      - name: Verify production output
        if: steps.changes.outputs.site_changed == 'true'
        run: bash scripts/ci/verify-dist.sh

  deploy:
    name: Fast production deploy
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: webigram-production-v4
      cancel-in-progress: false
    env:
      SSH_HOST: webigram.ir
      SSH_PORT: '34822'
      SSH_USER: arna
      SITE_CHANGED: ${{ needs.prepare.outputs.site_changed }}
      SERVER_CHANGED: ${{ needs.prepare.outputs.server_changed }}
      DIRECTUS_CHANGED: ${{ needs.prepare.outputs.directus_changed }}
      COMPOSE_CHANGED: ${{ needs.prepare.outputs.compose_changed }}
      NGINX_CHANGED: ${{ needs.prepare.outputs.nginx_changed }}
    steps:
      - name: Configure production SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WEBIGRAM_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Repository secret WEBIGRAM_DEPLOY_SSH_KEY is not configured."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/webigram_deploy"
          chmod 600 "$HOME/.ssh/webigram_deploy"

          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          [webigram.ir]:34822 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHwe+Xzw7jZbNHs5vNgh0vKz7WSbVnBZ9eIlgjByfpg
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          timeout 15s ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/webigram_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=8 \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH deployment channel ready on $(hostname)"'

      - name: Deploy exact revision on wbg-001
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/webigram_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=8 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- \
              "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" \
              "$GITHUB_RUN_ATTEMPT" \
              "$SITE_CHANGED" \
              "$SERVER_CHANGED" \
              "$DIRECTUS_CHANGED" \
              "$COMPOSE_CHANGED" \
              "$NGINX_CHANGED" <<'REMOTE'
          set -Eeuo pipefail

          GITHUB_SHA="$1"
          GITHUB_RUN_ID="$2"
          GITHUB_RUN_ATTEMPT="$3"
          SITE_CHANGED="$4"
          SERVER_CHANGED="$5"
          DIRECTUS_CHANGED="$6"
          COMPOSE_CHANGED="$7"
          NGINX_CHANGED="$8"

          APP_DIR=/opt/apps/www-webigram.ir
          SOURCE_DIR="/tmp/webigram-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-source"
          RELEASE_DIR="/tmp/webigram-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-dist"
          PUBLIC_HEALTH_URL=https://webigram.ir/healthz
          EDGE_CONTAINER=edge-nginx

          export GITHUB_SHA GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          export SITE_CHANGED SERVER_CHANGED DIRECTUS_CHANGED COMPOSE_CHANGED NGINX_CHANGED
          export APP_DIR SOURCE_DIR RELEASE_DIR PUBLIC_HEALTH_URL EDGE_CONTAINER

          cleanup() {
            rm -rf "$SOURCE_DIR" "$RELEASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          rm -rf "$SOURCE_DIR" "$RELEASE_DIR"
          mkdir -p "$SOURCE_DIR" "$RELEASE_DIR"

          if git -C "$APP_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "Using production repository as the local Git object cache."
          else
            echo "Production repository is missing; cloning it once."
            rm -rf "$APP_DIR"
            timeout 60s git clone https://github.com/amdkna/www-webigram.ir.git "$APP_DIR"
          fi

          timeout 30s git -C "$APP_DIR" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$APP_DIR" cat-file -e "$GITHUB_SHA^{commit}"
          git -C "$APP_DIR" archive "$GITHUB_SHA" | tar -x -C "$SOURCE_DIR"

          test -s "$SOURCE_DIR/Dockerfile"
          test -s "$SOURCE_DIR/scripts/deploy/remote-deploy.sh"

          timeout --signal=TERM --kill-after=10s 360s \
            bash "$SOURCE_DIR/scripts/deploy/remote-deploy.sh"
          REMOTE

      - name: Remove temporary SSH material
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: rm -rf "$HOME/.ssh/webigram_deploy" "$HOME/.ssh/known_hosts"
