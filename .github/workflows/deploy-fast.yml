name: Deploy Webigram to Production Server

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/unstick-production-run.yml'
      - '.github/workflows/release-stale-deploy-lock.yml'
      - '.github/workflows/recover-stale-deploy.yml'
      - '.github/workflows/deploy-network-diagnostic.yml'
      - '.github/workflows/recover-production-local.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Classify, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: webigram-build-main
      cancel-in-progress: true
    outputs:
      site_changed: ${{ steps.changes.outputs.site_changed }}
      server_changed: ${{ steps.changes.outputs.server_changed }}
      directus_changed: ${{ steps.changes.outputs.directus_changed }}
      compose_changed: ${{ steps.changes.outputs.compose_changed }}
      nginx_changed: ${{ steps.changes.outputs.nginx_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/deploy/classify-changes.sh "$BEFORE_SHA" "$GITHUB_SHA" "${{ github.event_name }}" "$GITHUB_OUTPUT"

      - name: Cheap checks first
        run: bash scripts/ci/early-checks.sh

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.site_changed == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies with registry fallback
        if: steps.changes.outputs.site_changed == 'true'
        run: bash scripts/ci/npm-ci-fallback.sh

      - name: Astro and TypeScript checks
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run check

      - name: Build production site
        if: steps.changes.outputs.site_changed == 'true'
        run: bash scripts/ci/build-site.sh

      - name: Verify production output
        if: steps.changes.outputs.site_changed == 'true'
        run: bash scripts/ci/verify-dist.sh

      - name: Publish release bundle through Git
        if: steps.changes.outputs.site_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_repo="$RUNNER_TEMP/webigram-deploy-artifact"
          artifact_tar="$RUNNER_TEMP/webigram-dist.tgz"

          tar -C dist -czf "$artifact_tar" .
          rm -rf "$artifact_repo"
          mkdir -p "$artifact_repo"
          git -C "$artifact_repo" init
          git -C "$artifact_repo" config user.name "github-actions[bot]"
          git -C "$artifact_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$artifact_repo" checkout --orphan webigram-deploy-artifact

          cp "$artifact_tar" "$artifact_repo/webigram-dist.tgz"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_repo/revision"
          git -C "$artifact_repo" add webigram-dist.tgz revision
          git -C "$artifact_repo" commit -m "deploy artifact $GITHUB_SHA"
          git -C "$artifact_repo" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$artifact_repo" push --force origin HEAD:refs/heads/webigram-deploy-artifact

          echo "Published build bundle for $GITHUB_SHA through the Git transport."

  deploy:
    name: Fast production deploy
    needs: prepare
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    concurrency:
      group: webigram-production-v5
      cancel-in-progress: false
    env:
      APP_DIR: /opt/apps/www-webigram.ir
      PUBLIC_HEALTH_URL: https://webigram.ir/healthz
      EDGE_CONTAINER: edge-nginx
      SITE_CHANGED: ${{ needs.prepare.outputs.site_changed }}
      SERVER_CHANGED: ${{ needs.prepare.outputs.server_changed }}
      DIRECTUS_CHANGED: ${{ needs.prepare.outputs.directus_changed }}
      COMPOSE_CHANGED: ${{ needs.prepare.outputs.compose_changed }}
      NGINX_CHANGED: ${{ needs.prepare.outputs.nginx_changed }}
    steps:
      - name: Prepare exact source and release bundle
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/webigram-source"
          fetch_dir="$RUNNER_TEMP/webigram-fetch"
          release_dir="$RUNNER_TEMP/webigram-dist"
          artifact_tar="$RUNNER_TEMP/webigram-dist.tgz"

          rm -rf "$source_dir" "$fetch_dir" "$release_dir" "$artifact_tar"
          mkdir -p "$source_dir" "$release_dir"

          if git -C "$APP_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            repo_dir="$APP_DIR"
            echo "Using production repository as the local Git object cache."
          else
            echo "Production repository is unavailable; using a temporary Git cache."
            git init "$fetch_dir"
            git -C "$fetch_dir" remote add origin https://github.com/amdkna/www-webigram.ir.git
            repo_dir="$fetch_dir"
          fi

          timeout 45s git -C "$repo_dir" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$repo_dir" cat-file -e "$GITHUB_SHA^{commit}"
          git -C "$repo_dir" archive "$GITHUB_SHA" | tar -x -C "$source_dir"

          test -s "$source_dir/Dockerfile"
          test -s "$source_dir/scripts/deploy/sync-release.sh"

          if [ "$SITE_CHANGED" = "true" ]; then
            timeout 45s git -C "$repo_dir" fetch --force --no-tags origin               refs/heads/webigram-deploy-artifact:refs/remotes/origin/webigram-deploy-artifact

            artifact_revision=$(git -C "$repo_dir" show origin/webigram-deploy-artifact:revision | tr -d '\r\n')
            if [ "$artifact_revision" != "$GITHUB_SHA" ]; then
              echo "Deploy artifact revision mismatch: expected $GITHUB_SHA, got $artifact_revision" >&2
              exit 1
            fi

            git -C "$repo_dir" show origin/webigram-deploy-artifact:webigram-dist.tgz > "$artifact_tar"
            tar -xzf "$artifact_tar" -C "$release_dir"
            test -s "$release_dir/index.html"
            test -s "$release_dir/tools/index.html"
            echo "Release bundle received over Git transport."
          fi

          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Snapshot, sync source and publish static files
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          timeout 60s bash scripts/deploy/sync-release.sh

      - name: Apply only changed runtime services
        working-directory: /opt/apps/www-webigram.ir
        shell: bash
        run: timeout 180s bash scripts/deploy/apply-runtime.sh

      - name: Fast change-aware smoke checks
        working-directory: /opt/apps/www-webigram.ir
        shell: bash
        run: |
          set -euo pipefail
          smoke_timeout=90
          if [ "$DIRECTUS_CHANGED" = "true" ] || [ "$COMPOSE_CHANGED" = "true" ]; then
            smoke_timeout=180
          fi
          echo "Smoke-check hard timeout: ${smoke_timeout}s"
          timeout --signal=TERM --kill-after=5s "${smoke_timeout}s" bash scripts/deploy/verify-release.sh

      - name: Roll back automatically on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          if [ -f "$APP_DIR/scripts/deploy/rollback-release.sh" ]; then
            timeout --signal=TERM --kill-after=5s 60s bash "$APP_DIR/scripts/deploy/rollback-release.sh"
          else
            echo "Rollback helper is unavailable because source sync did not complete."
            exit 1
          fi

      - name: Record successful deployment
        if: ${{ success() }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$APP_DIR/.last-successful-deploy"
          echo "Successful production revision: $GITHUB_SHA"

      - name: Clean temporary deploy files
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          timeout 20s rm -rf             "${SOURCE_DIR:-$RUNNER_TEMP/webigram-source}"             "${RELEASE_DIR:-$RUNNER_TEMP/webigram-dist}"             "$RUNNER_TEMP/webigram-fetch"             "$RUNNER_TEMP/webigram-dist.tgz"
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::warning::Temporary deploy cleanup exceeded 20 seconds."
            exit 0
          fi
          exit "$rc"
