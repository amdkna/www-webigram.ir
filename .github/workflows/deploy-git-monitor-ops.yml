name: Deploy Git Monitor Ops

on:
  push:
    branches: [ops-git-monitor-recovery]
    paths:
      - .github/workflows/deploy-git-monitor-ops.yml
  workflow_dispatch:

concurrency:
  group: git-monitor-ops-recovery
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    env:
      APP_DIR: /opt/apps/mon.webigram.ir
      DEPLOY_IMAGE: ghcr.io/amdkna/www-git-monitor:fc373ad28452e1ee32f43a755890432b306d5745
      FALLBACK_IMAGE: git-monitor-local:webigram-ops-v3
    steps:
      - name: Verify monitor source on server
        run: |
          set -euo pipefail
          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/db/init.sql"
          test -f "$APP_DIR/.env"

      - name: Apply fixed runtime files from monitor main
        run: |
          set -euo pipefail

          cat > "$APP_DIR/Dockerfile" <<'DOCKERFILE'
          FROM node:22-alpine AS deps
          WORKDIR /app
          COPY package.json ./
          RUN npm install

          FROM node:22-alpine AS builder
          WORKDIR /app
          ENV NEXT_TELEMETRY_DISABLED=1
          COPY --from=deps /app/node_modules ./node_modules
          COPY . .
          RUN npm run build

          FROM node:22-alpine AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          ENV NEXT_TELEMETRY_DISABLED=1
          ENV HOSTNAME=0.0.0.0
          ENV PORT=3000
          COPY --from=builder /app/.next/standalone ./
          COPY --from=builder /app/.next/static ./.next/static
          COPY --from=builder /app/public ./public
          COPY --from=deps /app/node_modules ./node_modules
          COPY --from=builder /app/package.json ./package.json
          COPY --from=builder /app/worker ./worker
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKERFILE

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/opt/apps/mon.webigram.ir/docker-compose.yml')
          s = p.read_text()
          old = 'test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]'
          new = 'test: ["CMD", "node", "-e", "fetch(\'http://127.0.0.1:3000/api/health\').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Acquire fixed monitor image
        id: image
        run: |
          set -euo pipefail

          if timeout 90s docker pull "$DEPLOY_IMAGE"; then
            echo "image=$DEPLOY_IMAGE" >> "$GITHUB_OUTPUT"
            echo "Using published GHCR image $DEPLOY_IMAGE"
            exit 0
          fi

          echo 'GHCR pull unavailable from this runner; building local fallback.'
          timeout 180s docker build --tag "$FALLBACK_IMAGE" "$APP_DIR"
          docker image inspect "$FALLBACK_IMAGE" >/dev/null
          echo "image=$FALLBACK_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Start monitor stack
        env:
          RESOLVED_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          docker network inspect public_proxy >/dev/null 2>&1 || docker network create public_proxy
          timeout 120s env APP_IMAGE="$RESOLVED_IMAGE" docker compose up -d --remove-orphans --no-build
          APP_IMAGE="$RESOLVED_IMAGE" docker compose ps

      - name: Verify health and public endpoint
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' git-monitor-web 2>/dev/null || true)
            RUNNING=$(docker inspect --format='{{.State.Running}}' git-monitor-web 2>/dev/null || true)
            CODE=$(curl -sS -o /tmp/git-monitor-health.json -w '%{http_code}' \
              --connect-timeout 2 --max-time 4 http://127.0.0.1:3085/api/health || true)
            echo "attempt=$i running=$RUNNING health=$STATUS local_http=$CODE"
            if [ "$RUNNING" = "true" ] && [ "$STATUS" = "healthy" ] && [ "$CODE" = "200" ]; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo '=== web logs ==='
            docker logs --tail=300 git-monitor-web || true
            echo '=== worker logs ==='
            docker logs --tail=200 git-monitor-worker || true
            exit 1
          fi

          timeout 10s docker exec edge-nginx wget -qO- http://git-monitor-web:3000/api/health
          echo

          PUBLIC_CODE=$(curl -ksS -o /tmp/mon-public.out -w '%{http_code}' \
            --connect-timeout 3 --max-time 8 \
            --resolve mon.webigram.ir:443:127.0.0.1 \
            https://mon.webigram.ir/api/health || true)
          echo "public_http=$PUBLIC_CODE"
          cat /tmp/mon-public.out || true
          echo
          test "$PUBLIC_CODE" = "200"
