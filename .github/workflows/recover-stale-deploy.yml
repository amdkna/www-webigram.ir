name: Recover Stale Production Deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-stale-deploy.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# One-shot recovery for a deploy that already passed public health checks but
# remained stuck in the self-hosted runner's final bookkeeping step.
jobs:
  recover:
    name: Cancel stale production run
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale deployment run 73
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_RUN_ID: '34279175513'
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}/cancel" || true

          for i in $(seq 1 20); do
            STATUS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.status')
            CONCLUSION=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${STALE_RUN_ID}" --jq '.conclusion // ""')
            echo "attempt=$i status=$STATUS conclusion=$CONCLUSION"
            [ "$STATUS" = "completed" ] && exit 0
            sleep 3
          done

          echo 'Stale workflow did not acknowledge cancellation.' >&2
          exit 1
