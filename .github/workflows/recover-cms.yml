name: Recover Webigram CMS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-cms.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webigram-cms-recovery
  cancel-in-progress: false

jobs:
  recover-cms:
    name: Recover Directus CMS
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      APP_DIR: /opt/apps/www-webigram.ir
      EDGE_CONTAINER: edge-nginx
      CMS_HEALTH_URL: https://cms.webigram.ir/server/ping
    steps:
      - name: Restore current Directus configuration and restart CMS
        run: |
          set -euo pipefail

          test -d "$APP_DIR/.git"
          git -C "$APP_DIR" fetch origin main
          git -C "$APP_DIR" checkout -B main origin/main

          cd "$APP_DIR"
          docker network inspect app-net >/dev/null 2>&1 || docker network create app-net

          # Bring the secret generator and PostgreSQL up first. The password stored in
          # the secret volume can outlive or be recreated independently from the
          # PostgreSQL data volume, so verify that the persisted DB role still uses it.
          docker compose up -d directus-secrets-init directus-db

          db_healthy=0
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' webigram-directus-db 2>/dev/null || true)
            echo "db_attempt=$i status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              db_healthy=1
              break
            fi
            sleep 2
          done

          if [ "$db_healthy" -ne 1 ]; then
            echo "ERROR: Directus PostgreSQL did not become healthy."
            docker compose ps || true
            docker logs --tail 200 webigram-directus-db || true
            exit 1
          fi

          # Never print the password. First test TCP auth exactly as Directus uses it.
          # If the secret and the persisted PostgreSQL role are out of sync, repair the
          # role through the local trusted socket and verify TCP auth again.
          docker compose exec -T directus-db sh -s <<'DB_SYNC'
          set -eu
          CURRENT_PASSWORD="$(cat /run/directus-secrets/db_password)"

          if PGPASSWORD="$CURRENT_PASSWORD" psql \
            -h 127.0.0.1 -U directus -d directus \
            -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null 2>&1; then
            echo "db_credentials=aligned"
            exit 0
          fi

          echo "db_credentials=mismatch; resyncing role password"
          psql -U directus -d directus \
            -v ON_ERROR_STOP=1 \
            -v db_password="$CURRENT_PASSWORD" <<'SQL' >/dev/null
          ALTER ROLE directus WITH PASSWORD :'db_password';
          SQL

          PGPASSWORD="$CURRENT_PASSWORD" psql \
            -h 127.0.0.1 -U directus -d directus \
            -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null
          echo "db_credentials=resynced"
          DB_SYNC

          # Recreate Directus only after database authentication is known-good.
          docker compose up -d --force-recreate directus

          directus_healthy=0
          for i in $(seq 1 60); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' webigram-directus 2>/dev/null || true)
            echo "directus_attempt=$i status=$STATUS"
            if [ "$STATUS" = "healthy" ]; then
              directus_healthy=1
              break
            fi
            sleep 2
          done

          if [ "$directus_healthy" -ne 1 ]; then
            echo "ERROR: Directus did not become healthy."
            docker compose ps || true
            docker logs --tail 250 webigram-directus || true
            docker logs --tail 120 webigram-directus-db || true
            exit 1
          fi

          # Edge nginx resolves the Docker upstream name when its config is loaded.
          # Reload after recreating Directus so cms.webigram.ir points at its current IP.
          docker exec "$EDGE_CONTAINER" nginx -t
          docker exec "$EDGE_CONTAINER" nginx -s reload

          cms_ready=0
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /tmp/webigram-cms-ping -w '%{http_code}' \
              --connect-timeout 3 --max-time 5 "$CMS_HEALTH_URL" || true)
            echo "cms_public_attempt=$i http=$CODE body=$(cat /tmp/webigram-cms-ping 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then
              cms_ready=1
              break
            fi
            sleep 2
          done

          if [ "$cms_ready" -ne 1 ]; then
            echo "ERROR: Directus is healthy internally but cms.webigram.ir is not reachable."
            docker inspect "$EDGE_CONTAINER" --format '{{json .NetworkSettings.Networks}}' || true
            docker inspect webigram-directus --format '{{json .NetworkSettings.Networks}}' || true
            docker logs --tail 250 "$EDGE_CONTAINER" || true
            exit 1
          fi

          echo "CMS recovery successful: $CMS_HEALTH_URL returned HTTP 200."
