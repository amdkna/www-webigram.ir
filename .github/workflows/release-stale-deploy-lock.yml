name: Release Stale Webigram Deploy Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stale-deploy-lock.yml'

permissions:
  contents: read

# One-shot recovery workflow. It deliberately shares the production deploy
# concurrency group and asks GitHub's scheduler to cancel the stale holder.
concurrency:
  group: webigram-production-v3
  cancel-in-progress: true

jobs:
  release:
    name: Release stale deployment lock
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Released stale webigram-production-v3 concurrency lock (retry).'
