name: Diagnose Coursino host from Webigram runner

on:
  push:
    branches:
      - ops/coursino-host-diagnostic
    paths:
      - '.github/workflows/coursino-host-diagnostic.yml'

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect Coursino Live host with strict timeouts
        shell: bash
        run: |
          set -u
          run() { label="$1"; shift; echo "=== ${label} ==="; timeout 8s "$@" 2>&1 || echo "TIMEOUT_OR_ERROR:${label}:$?"; }
          run host hostname
          run time date -Is
          run docker-version docker version
          run docker-info docker info
          echo '=== containers ==='
          timeout 8s docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' 2>&1 | grep -E 'coursino|livekit|NAMES' || echo 'DOCKER_PS_FAILED_OR_TIMED_OUT'
          run app-health curl --fail --silent --show-error --max-time 6 http://127.0.0.1:18080/healthz
          echo '=== app logs last 15m ==='
          timeout 10s docker logs --since 15m coursino-live 2>&1 | sed -E 's#rtmps?://[^ ]+#RTMP_URL_REDACTED#g' | tail -n 220 || echo 'APP_LOGS_FAILED_OR_TIMED_OUT'
          echo '=== egress logs last 15m ==='
          timeout 10s docker logs --since 15m coursino-live-egress 2>&1 | sed -E 's#rtmps?://[^ ]+#RTMP_URL_REDACTED#g' | tail -n 320 || echo 'EGRESS_LOGS_FAILED_OR_TIMED_OUT'
          echo '=== state files ==='
          for f in /opt/apps/live.webigram.ir/data/aparat-egress.json /opt/apps/live.webigram.ir/data/arvan-egress.json; do
            echo "--- ${f##*/} ---"
            timeout 3s sh -c 'if [ -f "$1" ]; then cat "$1"; else echo missing; fi' sh "$f" || echo STATE_READ_TIMEOUT
          done
          echo '=== git connectivity ==='
          timeout 8s git ls-remote git@github.com:amdkna/www-coursino-live.git HEAD 2>&1 || echo 'GIT_REMOTE_FAILED_OR_TIMED_OUT'
