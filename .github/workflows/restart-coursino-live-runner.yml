name: Restart Coursino Live runner

on:
  push:
    branches:
      - diagnostics/coursino-host-repair
    paths:
      - '.github/workflows/restart-coursino-live-runner.yml'

jobs:
  restart-runner:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Restart only the Coursino Live GitHub Actions service
        shell: bash
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          unit="$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '/actions\.runner/ && /www-coursino-live/ {print $1; exit}')"
          if [ -z "$unit" ]; then
            unit="$(systemctl list-units --all --type=service --no-legend 2>/dev/null | awk '/actions\.runner/ && /www-coursino-live/ {print $1; exit}')"
          fi
          echo "runner_unit=${unit:-missing}"
          test -n "$unit"
          sudo -n systemctl restart "$unit"
          sleep 3
          sudo -n systemctl is-active "$unit"
          echo 'coursino_live_runner_restarted=true'
